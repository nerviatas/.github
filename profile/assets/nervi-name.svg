<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="900" height="240" fill="#05070A" />

  <!-- NERVI -->
  <text x="70" y="145"
        fill="#E6DED1"
        font-family="FiraCode, 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="80">
    NERVI
  </text>

  <!-- Double slashes with nerve nodes -->

  <!-- First slash group -->
  <g transform="translate(360, 60) rotate(15)">
    <!-- Bar -->
    <rect x="0" y="0" width="10" height="120" fill="#E6DED1" />

    <!-- Cross cut-out -->
    <rect x="0" y="56" width="10" height="8"  fill="#05070A" /> <!-- horizontal arm -->
    <rect x="3" y="52" width="4"  height="16" fill="#05070A" /> <!-- vertical arm -->

    <!-- Circular node -->
    <circle cx="5" cy="60" r="5" fill="#05070A" />
  </g>

  <!-- Second slash group -->
  <g transform="translate(395, 60) rotate(15)">
    <!-- Bar -->
    <rect x="0" y="0" width="10" height="120" fill="#E6DED1" />

    <!-- Circular node -->
    <circle cx="5" cy="60" r="5" fill="#05070A" />
  </g>

  <!-- ATAS -->
  <text x="415" y="145"
        fill="#E6DED1"
        font-family="FiraCode, 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="80">
    ATAS
  </text>
</svg>
